<div class="flex flex-col space-y-1">
  <div class="flex justify-between items-center">
    <span class="label-sm text-inputLabel">Tasks</span>
    <div class="py-0.5 px-3 bg-[#E0E8FF] rounded-xl">
      <span class="label-sm text-inputLabel">0 tasks</span>
    </div>
  </div>

  <div
    class="flex flex-col text-center space-y-5 bg-bgSurface-low justify-center items-center p-8 border-2 border-gray-200 border-dashed"
  >
    <div
      class="w-12 h-12 flex items-center justify-center rounded-xl bg-bgAvatar"
    >
      <svg width="18" height="16" viewBox="0 0 18 16">
        <use href="#AddTaskIcon"></use>
      </svg>
    </div>
    <p class="wrap-break-word text-textSecondary text-sm">
      No tasks have been added to this epic yet
    </p>
    <button
      (click)="goTo()"
      type="button"
      class="btn-primary cursor-pointer"
    >
      + Add Task
    </button>
  </div>
</div>
