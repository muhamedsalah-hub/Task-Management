<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
  @for (item of [1, 2, 3, 4, 5, 6]; track $index) {
    <div
      class="bg-white rounded-md p-5 justify-between flex flex-col space-y-5"
    >
      <div class="flex justify-between">
        <div
          class="bg-skeleton h-2 w-16 rounded-xs py-1 px-2 animate-pulse"
        ></div>
        <div class="bg-skeleton h-1 w-4 rounded-xs animate-pulse"></div>
      </div>

      <div class="h-4 w-48 bg-skeleton animate-pulse"></div>

      <div class="flex space-x-3 items-center">
        <div class="bg-skeleton animate-pulse p-2 h-10 w-10 rounded-xl"></div>
        <div class="h-3 w-24 bg-skeleton animate-pulse"></div>
      </div>

      <div class="w-full h-1 bg-skeleton animate-pulse"></div>

      <div class="flex justify-between items-center">
        <div class="h-2 w-24 bg-skeleton animate-pulse"></div>
        <div class="h-2 w-24 bg-skeleton animate-pulse"></div>
      </div>
    </div>
  }
</div>
