<div
  class="absolute w-full bottom-0 max-h-3/4 md:max-h-auto md:w-120 md:top-1/2 md:left-1/2 z-50 md:-translate-x-1/2 md:-translate-y-1/2"
>
  <form [formGroup]="emailForm" (ngSubmit)="inviteSubmission()">
    <div class="flex flex-col space-y-4 rounded-lg bg-white p-6">
      <div class="flex items-center justify-between">
        <div
          class="w-10 h-10 rounded-lg bg-bgPrimary flex justify-center items-center"
        >
          <svg width="19" height="14" viewBox="0 0 19 14">
            <use href="#invite"></use>
          </svg>
        </div>

        <button class="cursor-pointer" (click)="closePopup()">
          <svg width="16" height="16" viewBox="0 0 16 16">
            <use href="#close"></use>
          </svg>
        </button>
      </div>
      <div>
        <h1 class="text-3xl text-textPrimary font-semibold">Invite Members</h1>
      </div>
      <div>
        <p class="text-sm text-gray-500">
          Send an invitation to join the Architectural Studio workspace.
        </p>
      </div>
      <div class="flex flex-col space-y-2">
        <label class="title-sm font-bold text-inputLabel">Email</label>
        <input
          formControlName="email"
          type="email"
          class="input border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none"
          placeholder="Enter email address"
        />
      </div>
      <div class="flex flex-col md:flex-row md:justify-between md:items-center">
        <button
          type="button"
          (click)="closePopup()"
          class="text-bgPrimary cursor-pointer order-2 md:order-1 rounded-xs px-4 py-2 text-sm font-semibold"
        >
          Cancel
        </button>
        <button
          type="submit"
          [ngClass]="{
            'bg-gray-400': emailForm.invalid,
            'bg-bgPrimary cursor-pointer': emailForm.valid,
          }"
          class="btn-primary order-1 md:order-2 rounded-xs px-4 py-2 text-sm font-semibold"
        >
          Send Invite
        </button>
      </div>
    </div>
  </form>
</div>
