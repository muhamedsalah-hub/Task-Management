<section class="bg-bgBackground min-h-screen flex flex-col space-y-8 p-6">
  <!--      Add Task header           -->
  <div>
    <span
      class="hidden md:block text-xs uppercase font-semibold tracking-wider text-gray-500"
      >Projects > project name > Tasks ><span class="text-bgPrimary"
        >New Task</span
      ></span
    >
    <div class="flex flex-col space-y-2">
      <h1 class="headline-lg text-textPrimary">Create New Task</h1>
      <p class="text-textSecondary text-sm">
        Initialize a new work item within the Architectural Workspace ecosystem.
      </p>
    </div>
  </div>

  <div class="w-full md:self-center md:rounded-lg md:bg-white md:p-6">
    <!--              Form Content                -->

    <form
      [formGroup]="addTaskForm"
      class="flex flex-col space-y-5"
      (ngSubmit)="addTaskSubmission()"
    >
      <div class="flex flex-col space-y-1">
        <div class="flex items-center space-x-1">
          <label for="name" class="label-sm text-inputLabel">Title</label
          ><span class="text-error">*</span>
        </div>
        <div>
          <div class="input">
            <input
              class="title-md w-full outline-0"
              id="name"
              formControlName="title"
              type="text"
              placeholder="E.g., Design System Documentation"
            />
          </div>
        </div>
        @if (
          addTaskForm.get("title")?.errors && addTaskForm.get("title")?.touched
        ) {
          <app-field-error message="Title is Required" />
        }
      </div>

      <div
        class="flex flex-col space-y-5 md:flex-row md:justify-between md:items-center md:space-y-0 md:space-x-4"
      >
        <div class="md:flex-1 flex flex-col space-y-1">
          <label for="status" class="label-sm text-inputLabel">Status</label>
          <div class="input py-4">
            <select
              id="status"
              formControlName="status"
              class="w-full cursor-pointer outline-0"
            >
              @for (statue of statusValues; track $index) {
                <option [value]="statue">
                  {{ statue.replaceAll("_", " ") }}
                </option>
              }
            </select>
          </div>
        </div>

        <div class="md:flex-1 flex flex-col space-y-1">
          <label for="assignee" class="label-sm text-inputLabel"
            >Assignee</label
          >
          <div class="input py-4">
            <select
              id="assignee"
              formControlName="assignee_id"
              class="w-full cursor-pointer outline-0"
            >
              <option selected [value]="null">Select Team Member</option>
              @for (member of members$ | async; track member.member_id) {
                <option [value]="member.user_id">
                  {{ member.metadata.name }}
                </option>
              }
            </select>
          </div>
        </div>
      </div>

      <div class="flex flex-col space-y-1">
        <label for="epic" class="label-sm text-inputLabel">Epic</label>
        <div class="input py-4">
          <select
            id="epic"
            formControlName="epic_id"
            class="w-full cursor-pointer outline-0"
          >
            <option selected [value]="null">Select an Epic</option>
            @for (epic of epics$ | async; track epic.id) {
              <option [value]="epic.id">
                {{ epic.epic_id }} {{ epic.title | maxLengthString }}
              </option>
            }
          </select>
        </div>
      </div>

      <div class="flex flex-col space-y-1">
        <label for="deadline" class="label-sm text-inputLabel">
          Due date
        </label>
        <mat-form-field appearance="outline" class="custom-date-input">
          <input
            id="deadline"
            class="outline-0 w-300"
            matInput
            [matDatepicker]="picker"
            [min]="today()"
            placeholder="mm/dd/yyyy"
            formControlName="due_date"
          />

          <mat-datepicker-toggle matIconSuffix [for]="picker">
          </mat-datepicker-toggle>

          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
      </div>

      <div class="flex flex-col space-y-1">
        <label for="description" class="label-sm text-inputLabel"
          >Description</label
        >
        <div class="input w-full">
          <textarea
            class="title-md w-full outline-0"
            id="description"
            formControlName="description"
            type="text"
            placeholder="Briefly describe the task scope..."
            rows="5"
          ></textarea>
        </div>
      </div>

      <div
        class="my-5 lg:my-0 bg-white p-6 flex flex-col space-y-5 lg:space-x-4 lg:space-y-0 lg:flex-row lg:justify-end lg:items-center"
      >
        <button
          [ngClass]="{
            'bg-gray-400': addTaskForm.invalid,
            'bg-bgPrimary cursor-pointer': addTaskForm.valid,
          }"
          class="text-lg btn-primary rounded-md w-full lg:w-fit lg:order-2"
        >
          + Create Task
        </button>
        <button
          [routerLink]="[
            '/projects',
            _ProjectContextService.projectId(),
            'tasks',
          ]"
          [queryParams]="{ view: 'board' }"
          type="button"
          class="cursor-pointer text-lg btn-secondary rounded-md w-full lg:w-fit lg:order-1"
        >
          Back
        </button>
      </div>
    </form>
  </div>
</section>
